<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de orçamento Nanolux · SOMMAR</title>
<script src="assets.js"></script>
<style>
/* ============ INTERFACE ============ */
:root{
  --teal:#079dbb; --teal-d:#078ead; --green:#55be4b; --ink:#111719; --ink2:#26343b;
  --muted:#64757d; --line:#dfe8eb; --soft:#f3f7f8; --card:#ffffff; --danger:#c0392b;
  --grad:linear-gradient(90deg,#14a8c2,#60c24b);
}
*{box-sizing:border-box}
html,body{margin:0;background:#eef3f5;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.app-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line)}
.app-top::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--grad)}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.b-logo{font-weight:800;font-size:22px;color:#17a8c2;letter-spacing:.3px}
.b-sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:10px;flex-shrink:0}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .08s,box-shadow .15s,background .15s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 2px 10px rgba(20,168,194,.35)}
.btn.primary:hover{box-shadow:0 4px 16px rgba(20,168,194,.45)}
.btn.primary[disabled]{opacity:.6;cursor:wait}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink2)}
.btn.ghost:hover{background:var(--soft)}
.btn.small{padding:7px 11px;font-size:13px;border-radius:8px}
.btn.add{background:#e6f6f9;color:var(--teal-d);border:1px dashed #9fd7e3}
.btn.add:hover{background:#d9f0f5}
.app{display:grid;grid-template-columns:minmax(380px,460px) 1fr;gap:24px;padding:24px;align-items:start;max-width:1800px;margin:0 auto}
.form{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h2{margin:0 0 14px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h2 .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--grad);color:#fff;font-size:12px}
.card h2 .opt{font-weight:500;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
.grid3{display:grid;grid-template-columns:1fr .9fr 1.1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--ink2)}
label.f .hint{font-weight:400;color:var(--muted)}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;border:1px solid #d3dfe3;border-radius:8px;padding:9px 10px;background:#fff;font-size:14px;font-weight:400;outline:none;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:62px;line-height:1.4}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(7,157,187,.15)}
input[readonly]{background:var(--soft);color:var(--muted)}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--ink2);cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--teal)}
.chips{display:flex;gap:14px;flex-wrap:wrap;padding-top:2px}
.item{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#fbfdfd;position:relative}
.item::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--teal)}
.item:nth-child(even)::before{background:var(--green)}
.item-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.item-head .tag{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.item-head select{flex:1;min-width:0;padding:7px 8px;font-size:13px}
.ibtn{border:1px solid var(--line);background:#fff;border-radius:7px;width:30px;height:30px;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted);flex-shrink:0;font-size:14px}
.ibtn:hover{background:var(--soft);color:var(--ink)}
.ibtn.del:hover{color:var(--danger);border-color:#f0c9c4;background:#fdf3f2}
.item .stack{display:flex;flex-direction:column;gap:10px}
.item-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px;flex-wrap:wrap}
.sub{font-size:13px;color:var(--muted)}
.sub b{color:#126e64;font-size:15px}
.linkbtn{background:none;border:0;padding:0;color:var(--teal-d);font-size:11.5px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.lab-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.add-row{display:flex;gap:10px;flex-wrap:wrap}
.totals{margin-top:14px;border-radius:12px;background:var(--grad);color:#fff;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.totals .r{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.totals .r.old span:last-child{text-decoration:line-through;opacity:.85}
.totals .r.big{font-size:20px;font-weight:800;border-top:1px solid rgba(255,255,255,.4);padding-top:8px;margin-top:2px}
.disc{margin-top:14px;padding:12px;border:1px dashed #b9dbe3;border-radius:12px;background:#f7fcfd}
.disc .ttl{font-size:12px;font-weight:700;color:var(--teal-d);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.seg{display:inline-flex;border:1px solid #d3dfe3;border-radius:8px;overflow:hidden;height:38px}
.seg button{border:0;background:#fff;padding:0 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--teal);color:#fff}
details.card summary{cursor:pointer;font-weight:700;font-size:15px;list-style:none;display:flex;align-items:center;justify-content:space-between}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"▾";color:var(--muted);transition:transform .2s}
details.card[open] summary::after{transform:rotate(180deg)}
details.card[open] summary{margin-bottom:14px}
.preview-col{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;border-radius:14px;background:#dfe7ea;padding:16px;border:1px solid var(--line)}
.prev-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:0 2px 12px}
#preview{display:flex;flex-direction:column;gap:16px}
.pgbox{position:relative;overflow:hidden;box-shadow:0 6px 24px rgba(17,23,25,.12);border-radius:4px;background:#fff}
.pgbox > .pg{transform-origin:0 0;position:absolute;left:0;top:0}
#stage{position:fixed;left:0;top:0;width:1500px;z-index:-5;pointer-events:none}
#overlay{position:fixed;inset:0;z-index:100;background:rgba(238,243,245,.97);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:600;color:var(--ink2)}
#overlay.on{display:flex}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid #cfe6ec;border-top-color:var(--teal);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:120;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:1000px){
  .app{grid-template-columns:1fr;padding:14px}
  .preview-col{position:static;max-height:none}
  .b-sub{display:none}
  .app-top{padding:10px 14px}
}
@media (max-width:480px){.grid{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}.grid3 > :last-child{grid-column:1/-1}}

<body>
<header class="app-top">
  <div class="brand"><span class="b-logo">SOMMAR</span><span class="b-sub">Gerador de orçamento · Nanolux</span></div>
  <div class="actions">
    <button class="btn ghost" id="btnNovo" type="button" title="Limpar e começar um orçamento novo">Novo orçamento</button>
    <button class="btn primary" id="btnPdf" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 19h16"/></svg>
      Baixar PDF
    </button>
  </div>
</header>

<main class="app">
  <section class="form" id="form">
    <div class="card">
      <h2><span class="n">1</span>Dados do orçamento</h2>
      <div class="grid">
        <label class="f full">Cliente<input type="text" data-f="cliente" placeholder="Nome do cliente"></label>
        <label class="f">Projeto<input type="text" data-f="projeto" placeholder="Ex.: Fachada stand"></label>
        <label class="f">Local<input type="text" data-f="local" placeholder="Cidade/UF"></label>
        <label class="f full">Nº do orçamento
          <div class="inline"><input type="text" data-f="numero"><button class="btn ghost small" id="btnNum" type="button" title="Gerar outro número aleatório">🎲 Gerar novo</button></div>
        </label>
        <label class="f">Emissão<input type="date" data-f="emissao"></label>
        <label class="f">Validade <span class="hint">(dias após a emissão)</span><input type="number" min="1" step="1" data-f="validadeDias"></label>
      </div>
    </div>

    <div class="card">
      <h2><span class="n">2</span>Itens do orçamento</h2>
      <div id="itens"></div>
      <div class="add-row">
        <button class="btn add small" type="button" data-add="nanolux">+ Aplicação Nanolux</button>
        <button class="btn add small" type="button" data-add="protocolo">+ Protocolo técnico</button>
        <button class="btn add small" type="button" data-add="outro">+ Outro item</button>
      </div>
    </div>

    <div class="card">
      <h2><span class="n">3</span>Resumo e investimento</h2>
      <div class="grid">
        <label class="f">Prazo estimado<input type="text" data-f="prazo" placeholder="Ex.: 1 dia"></label>
        <label class="f">Área total <span class="hint">(automática)</span><input type="text" id="areaCalc" readonly></label>
      </div>
      <div class="disc">
        <div class="ttl">Desconto <span class="hint" style="font-weight:400;color:var(--muted)">opcional — deixe o valor vazio para não aplicar</span></div>
        <div class="grid">
          <label class="f full">Nome do desconto<input type="text" data-f="descNome" placeholder="Ex.: Desconto à vista"></label>
          <label class="f">Tipo
            <div class="seg" id="descTipo"><button type="button" data-v="valor">R$</button><button type="button" data-v="pct">%</button></div>
          </label>
          <label class="f">Valor do desconto<input type="text" inputmode="decimal" data-f="descValor" placeholder="0,00"></label>
        </div>
      </div>
      <div class="totals" id="totals"></div>
    </div>

    <details class="card" id="more">
      <summary>Mais opções <span class="hint" style="font-weight:400;color:var(--muted);font-size:12px;margin-left:auto;margin-right:10px">condições, observações, cabeçalho</span></summary>
      <div class="grid">
        <label class="f">Representante<input type="text" data-f="representante"></label>
        <label class="f">Versão<input type="text" data-f="versao"></label>
        <label class="f full">Versões anteriores<input type="text" data-f="anteriores"></label>
        <label class="f full">Pagamento (resumo)<input type="text" data-f="pagResumo"></label>
        <label class="f full">Pagamento (detalhes)<textarea data-f="pagDetalhe" rows="2"></textarea></label>
        <div class="f full">Turnos autorizados
          <div class="chips">
            <label class="chk"><input type="checkbox" data-turno="Manhã"> Manhã</label>
            <label class="chk"><input type="checkbox" data-turno="Tarde"> Tarde</label>
            <label class="chk"><input type="checkbox" data-turno="Noite"> Noite</label>
          </div>
        </div>
        <label class="f full">Modalidade de execução<input type="text" data-f="execucao"></label>
        <label class="f full"><span class="lab-row">Observações do projeto <button class="linkbtn" type="button" data-reset="obs">restaurar padrão</button></span><textarea data-f="obs" rows="5"></textarea></label>
        <label class="f full"><span class="lab-row">Texto de apresentação (quadro cinza) <button class="linkbtn" type="button" data-reset="intro">restaurar padrão</button></span><textarea data-f="intro" rows="6"></textarea></label>
      </div>
    </details>
  </section>

  <section class="preview-col">
    <div class="prev-head"><span>Pré-visualização</span><span id="pgcount"></span></div>
    <div id="preview"></div>
  </section>
</main>

<datalist id="unidades"><option value="m²"><option value="protocolo"><option value="adicional"><option value="un"><option value="serviço"><option value="m"></datalist>
<div id="stage"></div>
<div id="overlay"><div class="spinner"></div><div id="ovtxt">Gerando PDF…</div></div>
<div class="toast" id="toast"></div>

<script src="lib/html2canvas.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script>
(function(){
'use strict';
/* ---------- Catálogo de produtos (edite aqui para mudar textos e preços padrão) ---------- */
var PRESETS = {
  nanolux:   {rotulo:'Aplicação completa da resina Nanolux', nome:'Aplicação completa da resina Nanolux', desc:'Tratamento e esterilização do vidro, isolamento da área e das esquadrias, aplicação do revestimento térmico Nanolux e garantia conforme condições contratuais.', unidade:'m²', valor:395, contaArea:true},
  protocolo: {rotulo:'Protocolo técnico - VT01', nome:'Protocolo técnico - VT01', desc:'Preparação, limpeza técnica, esterilização da superfície, proteção das esquadrias e organização da área de aplicação.', unidade:'protocolo', valor:480, contaArea:false},
  noturna:   {rotulo:'Adicional - aplicação noturna', nome:'Adicional - aplicação noturna', desc:'Acréscimo para aplicação em horário noturno (até 3 dias de serviço).', unidade:'adicional', valor:850, contaArea:false},
  limpeza:   {rotulo:'Limpeza pesada pós-obra', nome:'Limpeza pesada pós-obra', desc:'Limpeza pesada pós-obra das superfícies antes da aplicação.', unidade:'m²', valor:32, contaArea:false},
  outro:     {rotulo:'Outro (personalizado)', nome:'', desc:'', unidade:'un', valor:0, contaArea:false}

      '<button class="ibtn" type="button" data-act="down" title="Descer"' + (i === n - 1 ? ' disabled' : '') + '>↓</button>' +
      '<button class="ibtn" type="button" data-act="dup" title="Duplicar">⧉</button>' +
      '<button class="ibtn del" type="button" data-act="del" title="Remover">✕</button></div>' +
      '<div class="stack">' +
        '<div class="grid"><label class="f">Produto / serviço<input type="text" data-k="nome" value="' + esc(it.nome) + '"></label>' +
        '<label class="f">Área / referência<input type="text" data-k="area" value="' + esc(it.area) + '" placeholder="Ex.: Fachada"></label></div>' +
        '<label class="f"><span class="lab-row">Descrição <button class="linkbtn" type="button" data-act="rdesc">usar texto automático</button></span><textarea data-k="desc" rows="3">' + esc(it.desc) + '</textarea></label>' +
        '<div class="grid3"><label class="f">Quantidade<input type="text" inputmode="decimal" data-k="qtd" value="' + esc(it.qtd) + '"></label>' +
        '<label class="f">Unidade<input type="text" list="unidades" data-k="unidade" value="' + esc(it.unidade) + '"></label>' +
        '<label class="f">Valor unitário (R$)<input type="text" inputmode="decimal" data-k="valor" value="' + esc(it.valor) + '"></label></div>' +
        '<div class="item-foot"><label class="chk"><input type="checkbox" data-k="contaArea"' + (it.contaArea ? ' checked' : '') + '> Somar na área total</label>' +
        '<span class="sub">Subtotal: <b data-sub="' + it.id + '">' + brl(num(it.qtd) * num(it.valor)) + '</b></span></div>' +
      '</div></div>';
  }).join('') || '<p class="sub" style="margin:0 0 12px">Nenhum item. Adicione abaixo.</p>';
}
form.addEventListener('input', function(e){
  var t = e.target, f = t.dataset.f, k = t.dataset.k;
  if (f) { state[f] = t.value; agendar(); return; }
  if (t.dataset.turno) { state.turnos = $$('[data-turno]', form).filter(function(x){ return x.checked; }).map(function(x){ return x.dataset.turno; }); agendar(); return; }
  if (k) {
    var box = t.closest('.item'), it = state.itens[+box.dataset.i];
    if (k === 'preset') {
      var p = PRESETS[t.value]; it.preset = t.value; it.nome = p.nome; it.desc = p.desc; it.unidade = p.unidade; it.valor = f2(p.valor); it.contaArea = p.contaArea;
      renderItens();
    } else if (k === 'contaArea') it.contaArea = t.checked;
    else it[k] = t.value;
    agendar();
  }
});
form.addEventListener('change', function(e){
  var t = e.target;
  if (t.dataset.k === 'qtd' || t.dataset.k === 'valor') { var it = state.itens[+t.closest('.item').dataset.i]; if (String(t.value).trim()) { it[t.dataset.k] = t.value = f2(num(t.value)); agendar(); } }
  if (t.dataset.f === 'descValor' && String(t.value).trim()) { state.descValor = t.value = state.descTipo === 'pct' ? String(num(t.value)).replace('.', ',') : f2(num(t.value)); agendar(); }
});
form.addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.add) {
    var extra = {area:state.projeto || ''};
    if (b.dataset.add === 'outro') extra.nome = '';
    state.itens.push(item(b.dataset.add, extra)); renderItens(); agendar();
    var last = $('#itens .item:last-child'); if (last) { last.scrollIntoView({behavior:'smooth', block:'center'}); var inp = last.querySelector(b.dataset.add === 'nanolux' ? '[data-k="qtd"]' : '[data-k="nome"]'); if (inp) setTimeout(function(){ inp.focus(); inp.select && inp.select(); }, 250); }
    return;
  }
  if (b.dataset.reset) { state[b.dataset.reset] = b.dataset.reset === 'obs' ? OBS_PADRAO : INTRO_PADRAO; $('[data-f="' + b.dataset.reset + '"]').value = state[b.dataset.reset]; agendar(); return; }
  if (b.parentNode.id === 'descTipo') { state.descTipo = b.dataset.v; $$('#descTipo button').forEach(function(x){ x.classList.toggle('on', x === b); }); agendar(); return; }
  if (b.id === 'btnNum') { state.numero = novoNumero(state.emissao); $('[data-f="numero"]').value = state.numero; agendar(); toast('Novo número: ' + state.numero); return; }
  var act = b.dataset.act; if (!act) return;
  var i = +b.closest('.item').dataset.i, arr = state.itens;
  if (act === 'del') arr.splice(i, 1);
  else if (act === 'dup') { var cp = JSON.parse(JSON.stringify(arr[i])); cp.id = uid(); arr.splice(i + 1, 0, cp); }
  else if (act === 'up' && i > 0) arr.splice(i - 1, 0, arr.splice(i, 1)[0]);
  else if (act === 'down' && i < arr.length - 1) arr.splice(i + 1, 0, arr.splice(i, 1)[0]);
  else if (act === 'rdesc') { var p = PRESETS[arr[i].preset]; if (p && p.desc) arr[i].desc = p.desc; }
  renderItens(); agendar();
});
$('#btnNovo').addEventListener('click', function(){
  if (!confirm('Começar um orçamento novo? Os campos voltam ao padrão e um novo número é gerado.')) return;
  state = padrao(); salvar(); preencher(); render(); toast('Novo orçamento: ' + state.numero);
});
function toast(m){ var t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('on'); }, 2400); }

/* ---------- PDF ---------- */
function nomeArquivo(){
  var cli = (state.cliente || 'Cliente').trim();
  return ('NANOLUX_ORCAMENTO - ' + cli + ' - ' + (state.versao || 'V01') + ' - ' + state.numero).replace(/[\\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ') + '.pdf';
}
async function baixarPDF(){
  var btn = $('#btnPdf'), ov = $('#overlay'), stage = $('#stage');
  if (!window.html2canvas || !window.jspdf) { alert('As bibliotecas de PDF não carregaram. Verifique a pasta "lib" e recarregue a página.'); return; }
  btn.disabled = true; ov.classList.add('on');
  var sx = window.scrollX, sy = window.scrollY;
  try {
    clearTimeout(tmr); salvar(); render();
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    window.scrollTo(0, 0);
    var pages = $$('#preview .pg'), K = 720 / 1500;
    var pdf = new window.jspdf.jsPDF({orientation:'landscape', unit:'pt', format:[720, 405], compress:true});
    for (var i = 0; i < pages.length; i++) {
      $('#ovtxt').textContent = 'Gerando PDF… página ' + (i + 1) + ' de ' + pages.length;
      var cl = pages[i].cloneNode(true); cl.style.transform = 'none'; cl.style.position = 'relative';
      stage.innerHTML = ''; stage.appendChild(cl);
      await new Promise(function(r){ requestAnimationFrame(function(){ requestAnimationFrame(r); }); });
      var canvas = await window.html2canvas(cl, {scale:2, backgroundColor:'#ffffff', logging:false, useCORS:true, scrollX:0, scrollY:0, windowWidth:1500, windowHeight:844, width:1500, height:844});
      if (i > 0) pdf.addPage([720, 405], 'landscape');
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.93), 'JPEG', 0, 0, 720, 405, undefined, 'FAST');
      var base = cl.getBoundingClientRect();
      $$('[data-href]', cl).forEach(function(el){
        var r = el.getBoundingClientRect();
        pdf.link((r.left - base.left) * K, (r.top - base.top) * K, r.width * K, r.height * K, {url:el.getAttribute('data-href')});
      });
    }
    pdf.setProperties({title:state.numero + ' - Apresentação Nanolux e proposta - ' + (state.cliente || 'Cliente'), subject:'Proposta comercial Nanolux', author:'SOMMAR Soluções Sustentáveis LTDA.', creator:'Gerador de orçamento Nanolux'});
    pdf.save(nomeArquivo());
    toast('PDF baixado: ' + nomeArquivo());
  } catch (err) {
    console.error(err); alert('Não foi possível gerar o PDF: ' + (err && err.message ? err.message : err));
  } finally {
    stage.innerHTML = ''; ov.classList.remove('on'); btn.disabled = false; $('#ovtxt').textContent = 'Gerando PDF…'; window.scrollTo(sx, sy);
  }
}
$('#btnPdf').addEventListener('click', baixarPDF);
window.NX = {state:function(){ return state; }, baixarPDF:baixarPDF, render:render};

preencher();
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(render);
render();
})();
</script>
